# ---------------------------------------------------------------------------- #
#                             🧪 Fast Tests (Local)                            #
# ---------------------------------------------------------------------------- #

# Pytest for running tests
- repo: local
  hooks:
  - id: pytest
    name: "🐍 python · pytest"
    entry: ./.venv/bin/pytest
    language: system
    types: [python]
    pass_filenames: false
    args: [
      "tests",
      "-v",
      "--strict-markers",
      "--cov=src",
      "--cov=client",
      "--cov-report=html:build/coverage",
      "--cov-report=term-missing",
    ]
    stages: [pre-commit]
    always_run: true
    verbose: false
    require_serial: true
    fail_fast: false

