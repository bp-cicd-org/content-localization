services:
  # Speech-to-Speech service
  speech-to-speech:
    container_name: s2s
    build:
      context: .
      dockerfile: dockerfiles/s2s.dockerfile
    image: speech-to-speech:0.1
    tty: true
    stdin_open: true
    # Add any necessary environment variables here
    environment:
      # gRPC utils parameters.
      - AI4M_LOG_LEVEL=${S2S_LOG_LEVEL}
      - S2S_GRPC_CONCURRENCY_MODE=${S2S_GRPC_CONCURRENCY_MODE}
      - S2S_GRPC_THREADS_PER_PROCESS=${S2S_GRPC_THREADS_PER_PROCESS}

      # RIVA parameters, needed if running RIVA service.
      - AST_SERVER=riva-ast:${AST_NIM_GRPC_API_PORT}
      - TTS_SERVER=riva-tts:${TTS_NIM_GRPC_API_PORT}

      # S2S service parameters.
      - S2S_SERVICE=${S2S_SERVICE}
      - S2S_GRPC_API_PORT=${S2S_GRPC_API_PORT}
      - S2S_SERVER=speech-to-speech:${S2S_GRPC_API_PORT}
      - S2S_MAX_CONCURRENCY=${S2S_MAX_CONCURRENCY}
      - S2S_DEFAULT_SOURCE_LANGUAGE=${S2S_DEFAULT_SOURCE_LANGUAGE}
      - S2S_DEFAULT_TARGET_LANGUAGE=${S2S_DEFAULT_TARGET_LANGUAGE}
      - S2S_SAMPLE_RATE_HZ=${S2S_SAMPLE_RATE_HZ}
      - S2S_MESSAGE_SIZE=${S2S_MESSAGE_SIZE}

      # Third-party API keys — set whichever backend you use in .env
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - CAMB_API_KEY=${CAMB_API_KEY:-}

      # Timeout and polling configuration
      - HEALTH_CHECK_TIMEOUT=${HEALTH_CHECK_TIMEOUT:-5.0}
      - BUFFER_POLL_TIMEOUT=${BUFFER_POLL_TIMEOUT:-0.1}
      - S2S_CLEANUP_TIMEOUT=${S2S_CLEANUP_TIMEOUT:-1.0}
      - S2S_EL_DUBBING_POLL_INTERVAL=${S2S_EL_DUBBING_POLL_INTERVAL:-10}
      - S2S_EL_DUBBING_MAX_ATTEMPTS=${S2S_EL_DUBBING_MAX_ATTEMPTS:-120}
      - S2S_EL_KEEPALIVE_INTERVAL=${S2S_EL_KEEPALIVE_INTERVAL:-1}
      - S2S_CAMB_DUBBING_POLL_INTERVAL=${S2S_CAMB_DUBBING_POLL_INTERVAL:-10}
      - S2S_CAMB_DUBBING_MAX_ATTEMPTS=${S2S_CAMB_DUBBING_MAX_ATTEMPTS:-120}
      - S2S_CAMB_KEEPALIVE_INTERVAL=${S2S_CAMB_KEEPALIVE_INTERVAL:-1}

    # Add any necessary ports here
    ports:
      - ${S2S_GRPC_API_PORT}:${S2S_GRPC_API_PORT}
    runtime: nvidia
    volumes:
      - ./volumes/tmp:/tmp:rw
    networks:
      - content-localization-network
    depends_on:
      riva-ast:
        condition: service_healthy
        required: false
      riva-tts:
        condition: service_healthy
        required: false
    healthcheck:
      test: [ "CMD", "grpcurl", "--plaintext", "--import-path", "/opt/s2s/protos", "--proto", "/opt/s2s/protos/health.proto", "speech-to-speech:${S2S_GRPC_API_PORT}", "grpc.health.v1.Health/Check" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    shm_size: 16GB
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    profiles:
      - default
      - third-party-s2s
      - riva
      - lipsync
      - third-party-s2s-lipsync
      - riva-lipsync
      - third-party-s2s-asd-lipsync
      - riva-asd-lipsync
      - controller-riva
      - controller-third-party-s2s
      - demo-app-third-party-s2s
      - demo-app-riva

  # Riva ASR service
  riva-ast:
    container_name: ast
    image: ${AST_IMAGE}
    ports:
      - "${AST_NIM_HTTP_API_PORT}:${AST_NIM_HTTP_API_PORT}"
      - "${AST_NIM_GRPC_API_PORT}:${AST_NIM_GRPC_API_PORT}"
    environment:
      - NIM_GRPC_API_PORT=${AST_NIM_GRPC_API_PORT}
      - NIM_HTTP_API_PORT=${AST_NIM_HTTP_API_PORT}
      - NIM_TAGS_SELECTOR=${AST_NIM_TAGS_SELECTOR}
      - NGC_API_KEY=${AST_API_KEY}
    volumes:
      - ${AST_MODEL_MOUNT_PATH}:/opt/nim/.cache:rw
    networks:
      - content-localization-network

    healthcheck:
      test: [ "CMD", "curl", "-v", "http://riva-ast:${AST_NIM_HTTP_API_PORT}/v1/health/ready" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    profiles:
      - default
      - riva
      - riva-lipsync
      - riva-asd-lipsync
      - controller-riva
      - demo-app-riva

  # Riva TTS service
  riva-tts:
    container_name: tts
    image: ${TTS_IMAGE}
    runtime: nvidia
    shm_size: 4GB
    ports:
      - ${TTS_NIM_HTTP_API_PORT}:${TTS_NIM_HTTP_API_PORT}
      - ${TTS_NIM_GRPC_API_PORT}:${TTS_NIM_GRPC_API_PORT}
    environment:
      - NIM_GRPC_API_PORT=${TTS_NIM_GRPC_API_PORT}
      - NIM_HTTP_API_PORT=${TTS_NIM_HTTP_API_PORT}
      - NIM_TAGS_SELECTOR=${TTS_NIM_TAGS_SELECTOR}
      - NGC_API_KEY=${TTS_API_KEY}
      - NIM_DISABLE_MODEL_DOWNLOAD=true
    volumes:
      - ${TTS_MODEL_MOUNT_PATH}:/opt/nim/.cache:rw
      - ${TTS_MODEL_MOUNT_PATH}/nim_export:/opt/nim/export:rw
      - ${TTS_MODEL_MOUNT_PATH}/inner_cache:/data/models:rw
    networks:
      - content-localization-network
    healthcheck:
      test: [ "CMD", "curl", "-v", "http://riva-tts:${TTS_NIM_HTTP_API_PORT}/v1/health/ready" ]
      interval: 10s
      timeout: 10s
      retries: 30
      # Magpie TTS takes 20+ minutes to start up since it builds TensorRT engines on site.
      # So for the first time, this might need to be longer.
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    profiles:
      - default
      - riva
      - riva-lipsync
      - riva-asd-lipsync
      - controller-riva
      - demo-app-riva

  # LIPSYNC service
  lipsync:
    container_name: lipsync
    image: ${LIP_SYNC_IMAGE}
    runtime: nvidia
    shm_size: 4GB
    ports:
      - ${LIPSYNC_NIM_HTTP_API_PORT}:${LIPSYNC_NIM_HTTP_API_PORT}
      - ${LIPSYNC_NIM_GRPC_API_PORT}:${LIPSYNC_NIM_GRPC_API_PORT}
    environment:
      - NGC_API_KEY=${LIPSYNC_API_KEY}
      - NIM_HTTP_API_PORT=${LIPSYNC_NIM_HTTP_API_PORT}
      - NIM_GRPC_API_PORT=${LIPSYNC_NIM_GRPC_API_PORT}
      - AI4M_LOG_LEVEL=${LIPSYNC_LOG_LEVEL}
      - LIPSYNC_DEBUG_MODE=${LIPSYNC_DEBUG_MODE}
      - NIM_LOG_LEVEL=${LIPSYNC_LOG_LEVEL}
      - LOG_LEVEL=${LIPSYNC_LOG_LEVEL}
    volumes:
      - ${LIPSYNC_MODEL_MOUNT_PATH}:/opt/nim/.cache:rw
    networks:
      - content-localization-network
    healthcheck:
      test: [ "CMD", "curl", "-v", "http://lipsync:${LIPSYNC_NIM_HTTP_API_PORT}/v1/health/ready" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    profiles:
      - default
      - lipsync
      - third-party-s2s-lipsync
      - riva-lipsync
      - third-party-s2s-asd-lipsync
      - riva-asd-lipsync
      - asd-lipsync
      - controller-third-party-s2s
      - controller-riva
      - demo-app-third-party-s2s
      - demo-app-riva

  # Active Speaker Detection NIM
  asd:
    container_name: asd
    image: ${ASD_IMAGE}
    runtime: nvidia
    shm_size: 4GB
    ports:
      - ${ASD_NIM_HTTP_API_PORT}:${ASD_NIM_HTTP_API_PORT}
      - ${ASD_GRPC_API_PORT}:${ASD_GRPC_API_PORT}
    environment:
      - NGC_API_KEY=${ASD_API_KEY}
      - NIM_HTTP_API_PORT=${ASD_NIM_HTTP_API_PORT}
      - NIM_GRPC_API_PORT=${ASD_GRPC_API_PORT}
      - AI4M_LOG_LEVEL=${ASD_LOG_LEVEL}
      - NIM_LOG_LEVEL=${ASD_LOG_LEVEL}
      - LOG_LEVEL=${ASD_LOG_LEVEL}
      - MAXINE_MAX_CONCURRENCY_PER_GPU=1 # Required until ASD NIM supports concurrent requests
      - ASD_DIARIZATION_TOLERANCE_MS=${ASD_DIARIZATION_TOLERANCE_MS}

    volumes:
      - ${ASD_MODEL_MOUNT_PATH}:/opt/nim/.cache:rw
    networks:
      - content-localization-network
    healthcheck:
      test: [ "CMD", "curl", "-v", "http://asd:${ASD_NIM_HTTP_API_PORT}/v1/health/ready" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    profiles:
      - default
      - asd
      - third-party-s2s-asd-lipsync
      - riva-asd-lipsync
      - asd-lipsync
      - controller-third-party-s2s
      - controller-riva
      - demo-app-third-party-s2s
      - demo-app-riva

  # Controller service
  controller:
    container_name: controller
    build:
      context: .
      dockerfile: dockerfiles/controller.dockerfile
      args:
        CONTROLLER_PROFILER: ${CONTROLLER_PROFILER:-0}
    image: controller:0.1
    tty: true
    stdin_open: true
    # Add any necessary environment variables here
    environment:
      # gRPC utils parameters.
      - AI4M_LOG_LEVEL=${CONTROLLER_LOG_LEVEL}
      - CONTROLLER_GRPC_CONCURRENCY_MODE=${CONTROLLER_GRPC_CONCURRENCY_MODE}
      - CONTROLLER_GRPC_THREADS_PER_PROCESS=${CONTROLLER_GRPC_THREADS_PER_PROCESS}
      - CONTROLLER_GRPC_API_PORT=${CONTROLLER_GRPC_API_PORT}
      - CONTROLLER_MAX_CONCURRENCY=${CONTROLLER_MAX_CONCURRENCY}
      - CONTROLLER_SERVER=controller:${CONTROLLER_GRPC_API_PORT}

      # Service endpoints
      - S2S_SERVER=speech-to-speech:${S2S_GRPC_API_PORT}
      - ASD_SERVER=asd:${ASD_GRPC_API_PORT}
      - LIPSYNC_SERVER=lipsync:${LIPSYNC_NIM_GRPC_API_PORT}

      # S2S Service Configuration
      - S2S_SERVICE=${S2S_SERVICE}

      # Timeout and polling configuration
      - HEALTH_CHECK_TIMEOUT=${HEALTH_CHECK_TIMEOUT:-5.0}
      - BUFFER_POLL_TIMEOUT=${BUFFER_POLL_TIMEOUT:-0.1}
      - CONTROLLER_CONFIG_POLL_TIMEOUT=${CONTROLLER_CONFIG_POLL_TIMEOUT:-5.0}
      - CONTROLLER_CLEANUP_TIMEOUT=${CONTROLLER_CLEANUP_TIMEOUT:-10.0}

      # Optional: Debug port for VS Code
      - CONTROLLER_DEBUG_PORT=${CONTROLLER_DEBUG_PORT}
      - CONTROLLER_VS_CODE_DEBUG=${CONTROLLER_VS_CODE_DEBUG}

      # Optional: Enable Profiler
      - CONTROLLER_PROFILER=${CONTROLLER_PROFILER:-0}
      - CONTROLLER_PROFILER_OUTPUT_DIR=${CONTROLLER_PROFILER_OUTPUT_DIR:-/profiler}
      - CONTROLLER_METRIC_TRACKER=${CONTROLLER_METRIC_TRACKER:-0}
      - CONTROLLER_PROFILER_TYPE=${CONTROLLER_PROFILER_TYPE:-cprofiler}

      # Optional: Enable OpenTelemetry
      - CONTROLLER_OTEL_ENABLED=${CONTROLLER_OTEL_ENABLED:-false}
      - CONTROLLER_OTEL_OUTPUT_DIR=${CONTROLLER_OTEL_OUTPUT_DIR:-/otel}

    # Add any necessary ports here
    ports:
      - ${CONTROLLER_GRPC_API_PORT}:${CONTROLLER_GRPC_API_PORT}
      - ${CONTROLLER_DEBUG_PORT}:${CONTROLLER_DEBUG_PORT} # Debug port for VS Code
    runtime: nvidia
    volumes:
      - ./volumes/tmp:/tmp:rw
      - ./volumes/profiler:/profiler:rw
    networks:
      - content-localization-network
    depends_on:
      speech-to-speech:
        condition: service_healthy
        required: true
      asd:
        condition: service_healthy
        required: false
      lipsync:
        condition: service_healthy
        required: true
    healthcheck:
      test: [ "CMD", "grpcurl", "--plaintext", "--import-path", "/opt/controller/protos", "--proto", "/opt/controller/protos/health.proto", "controller:${CONTROLLER_GRPC_API_PORT}", "grpc.health.v1.Health/Check" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    profiles:
      - default
      - controller-third-party-s2s
      - controller-riva
      - asd-lipsync
      - demo-app-third-party-s2s
      - demo-app-riva

  demo-app:
    container_name: demo-app
    build:
      context: .
      dockerfile: ./client/demos/Dockerfile
      args:
        NEXT_PUBLIC_INPUT_FILE_NAME: "${DEFAULT_INPUT_FILE_NAME}"

    # Set environment variables directly in the compose file
    environment:
      - ENV_VARIABLE=production
      - NEXT_PUBLIC_ENV_VARIABLE=production
      - CONTROLLER_SERVER=controller:${CONTROLLER_GRPC_API_PORT}
      - DEFAULT_SOURCE_LANGUAGE=${S2S_DEFAULT_SOURCE_LANGUAGE}
      - DEFAULT_TARGET_LANGUAGE=${S2S_DEFAULT_TARGET_LANGUAGE}
      - OUTPUT_DIR=/demo-app
      - INPUT_DIR=/demo-app-inputs
      - NEXT_PUBLIC_LOG_LEVEL=${REFERENCE_APP_LOG_LEVEL}
      - REFERENCE_APP_ENABLE_PREPROCESSING=${REFERENCE_APP_ENABLE_PREPROCESSING}
      - S2S_SERVICE=${S2S_SERVICE}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - CAMB_API_KEY=${CAMB_API_KEY:-}

    # Set environment variables based on the .env file
    env_file:
      - configs/elevenlabs.env
    restart: always
    ports:
      - 3000:3000
    networks:
      - content-localization-network
    volumes:
      - ./volumes/demo-app:/demo-app:rw
      - ./assets:/demo-app-inputs:ro
    depends_on:
      controller:
        condition: service_healthy
        required: true
    profiles:
      - default
      - demo-app
      - demo-app-third-party-s2s
      - demo-app-riva

networks:
  content-localization-network:
    driver: bridge
